name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ros-gazebo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TUTORIAL_CI_CCACHE: /tmp/tutorial-bot-ccache
    steps:
      - uses: actions/checkout@v4
      - name: Cache compiler data
        uses: actions/cache@v4
        with:
          path: /tmp/tutorial-bot-ccache
          key: ros-jazzy-harmonic-ccache-${{ runner.arch }}-${{ hashFiles('examples/ros2_ws/src/tutorial_bot_plugins/**') }}
          restore-keys: ros-jazzy-harmonic-ccache-${{ runner.arch }}-
      - name: Build, test, and run the server-only smoke
        run: ./scripts/ci/run_ros_gazebo_container.sh --source "$GITHUB_WORKSPACE" --evidence "$RUNNER_TEMP/ros-gazebo" --scenario nominal
      - name: Upload ROS/Gazebo failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ros-gazebo-failure
          path: ${{ runner.temp }}/ros-gazebo
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt
      - name: Build site
        run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
