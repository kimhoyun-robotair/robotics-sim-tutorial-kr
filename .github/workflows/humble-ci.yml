name: ROS 2 Humble and Gazebo Classic 11

on:
  push:
    branches: [Humble]
  pull_request:
    branches: [Humble]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: humble-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    if: github.ref == 'refs/heads/Humble' || github.event_name == 'pull_request'
    name: Static tutorial contracts (no ROS)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate source, XML, links, and plugin contracts
        run: python3 scripts/validate_humble.py
      - name: Run validator regression tests
        run: python3 -m unittest discover -s tests -p 'test_validate_humble.py' -v
      - name: Build Korean documentation strictly
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-docs.txt
          mkdocs build --strict

  humble-build:
    name: Humble build, rendered sensors, RViz, and motion
    needs: static-contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    container:
      image: osrf/ros:humble-desktop-full-jammy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install build and model validation tools
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-pytest python3-yaml \
            liburdfdom-tools xvfb xauth xdotool imagemagick \
            libgl1-mesa-dri libglx-mesa0 mesa-utils procps
      - name: Resolve Humble dependencies
        run: |
          # ROS 2 Humble setup scripts read variables before defining them.
          # Enable nounset only after every environment overlay has been sourced.
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          set -u
          if [[ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]]; then
            rosdep init
          fi
          rosdep update --rosdistro humble
          rosdep install \
            --from-paths ros2_ws/src \
            --ignore-src \
            --rosdistro humble \
            -r -y
      - name: Build tutorial workspace
        id: workspace_build
        working-directory: ros2_ws
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          set -u
          colcon build \
            --symlink-install \
            --event-handlers console_direct+
      - name: Expand Xacro and validate URDF and SDF
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          set -u
          python3 scripts/validate_humble.py --require-ros-tools
      - name: Import every launch description
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          set -u
          for launch_path in ros2_ws/src/gazebo_tutorial_bringup/launch/*.launch.py; do
            launch_file="$(basename "$launch_path")"
            ros2 launch gazebo_tutorial_bringup "$launch_file" --show-args >/dev/null
          done
      - name: Run package tests
        working-directory: ros2_ws
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          set -u
          colcon test \
            --return-code-on-test-failure \
            --event-handlers console_direct+
          colcon test-result --verbose
      - name: Check sensor geometry and coordinate regressions
        if: always() && steps.workspace_build.outcome == 'success'
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          set -u
          python3 -m pytest -q scripts/test_humble_sensors.py
      - name: Render sensors and RViz and verify actual vehicle motion
        if: always() && steps.workspace_build.outcome == 'success'
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          set -u
          evidence="$GITHUB_WORKSPACE/ros2_ws/log/humble-evidence"
          mkdir -p "$evidence"
          printf '%s\n' "$GITHUB_SHA" > "$evidence/source-sha.txt"
          # Classic 11.10.2 prints its version but exits 255 for --version.
          dpkg-query -W gazebo > "$evidence/gazebo-version.txt"
          dpkg-query -W 'ros-humble-gazebo*' 'ros-humble-rviz*' > "$evidence/packages.txt"
          export LIBGL_ALWAYS_SOFTWARE=1 QT_X11_NO_MITSHM=1
          result=0
          for model in diffbot rover_diff rover_ackermann sensor_bot f1; do
            if ! xvfb-run -a -s '-screen 0 1920x1200x24' \
              python3 scripts/check_humble_runtime.py --model "$model" \
              --rviz --evidence "$evidence/$model"; then
              result=1
            fi
            if [[ -f "$evidence/$model/result.json" ]]; then
              cat "$evidence/$model/result.json"
            fi
          done
          exit "$result"
      - name: Preserve logs, measured values, and actual RViz views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humble-classic-validation
          path: |
            ros2_ws/log
            ros2_ws/build/**/test_results
          if-no-files-found: warn
