  <rect width="960" height="360" rx="24" fill="url(#bg)"/><text x="54" y="58" fill="#e3fafc" font-size="24" font-weight="700">상태 관측부터 자동 검사까지</text>
  <g font-family="sans-serif" text-anchor="middle" filter="url(#s)"><g fill="#f8f9fa"><rect x="50" y="120" width="140" height="92" rx="14"/><rect x="230" y="120" width="140" height="92" rx="14"/><rect x="410" y="120" width="140" height="92" rx="14"/><rect x="590" y="120" width="140" height="92" rx="14"/><rect x="770" y="120" width="140" height="92" rx="14"/></g><g fill="#102a43" font-size="17" font-weight="700"><text x="120" y="158">ECS 시스템</text><text x="300" y="158">Transport</text><text x="480" y="158">가상 시간</text><text x="660" y="158">서버 검사</text><text x="840" y="158">CI 결과</text></g><g fill="#486581" font-size="14"><text x="120" y="187">상태 관측</text><text x="300" y="187">동시 접근 방지</text><text x="480" y="187">주기 비교</text><text x="660" y="187">종료·정리</text><text x="840" y="187">커밋·기록</text></g></g>
  <g stroke="#99e9f2" stroke-width="4" fill="none"><path d="M190 166h34"/><path d="M370 166h34"/><path d="M550 166h34"/><path d="M730 166h34"/></g><g fill="#99e9f2"><path d="m224 166-10-7v14z"/><path d="m404 166-10-7v14z"/><path d="m584 166-10-7v14z"/><path d="m764 166-10-7v14z"/></g>
  <text x="480" y="294" fill="#c5f6fa" text-anchor="middle" font-family="sans-serif" font-size="18">같은 커밋과 설치 파일 사용 · 검사에서 실행한 프로세스 종료</text>
