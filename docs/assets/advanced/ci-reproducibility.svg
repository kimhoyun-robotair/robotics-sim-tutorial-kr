<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">CI 검사와 문서 배포 흐름</title><desc id="desc">같은 커밋에서 문서 빌드와 ROS·Gazebo 검사를 실행하고 결과를 보관하는 구조</desc><rect width="960" height="360" rx="24" fill="#0f172a"/><g font-family="sans-serif"><text x="50" y="50" fill="#f8fafc" font-size="24" font-weight="700">같은 커밋에서 문서와 시뮬레이션 검사</text><rect x="50" y="120" width="190" height="100" rx="16" fill="#fbbf24"/><text x="145" y="162" text-anchor="middle" fill="#422006" font-size="19" font-weight="700">커밋 SHA</text><text x="145" y="192" text-anchor="middle" fill="#713f12">같은 소스 사용</text><rect x="390" y="82" width="250" height="100" rx="16" fill="#38bdf8"/><rect x="390" y="220" width="250" height="100" rx="16" fill="#34d399"/><g text-anchor="middle" fill="#082f49"><text x="515" y="122" font-size="18" font-weight="700">문서 빌드 / Pages</text><text x="515" y="151">빌드한 문서 사이트</text></g><g text-anchor="middle" fill="#052e16"><text x="515" y="260" font-size="18" font-weight="700">ROS + Gazebo 검사</text><text x="515" y="289">로그와 메시지 기록</text></g><rect x="760" y="120" width="150" height="100" rx="16" fill="#e2e8f0"/><text x="835" y="162" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">검증 결과</text><text x="835" y="190" text-anchor="middle" fill="#334155">실패 로그 보관</text><g stroke="#f8fafc" stroke-width="4" fill="none"><path d="M240 170h90q30 0 30-35v-3h24"/><path d="M240 170h90q30 0 30 35v65h24"/><path d="M640 132h114"/><path d="M640 270h70q45 0 45-50v-50"/></g></g></svg>
