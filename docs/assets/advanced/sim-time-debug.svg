<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Simulation time 기반 publish 비교</title><desc id="desc">같은 2초 simulation에서 0.05초와 0.2초 publish 주기의 메시지 수 비교</desc><rect width="960" height="360" rx="24" fill="#fff7ed"/><g font-family="sans-serif"><text x="50" y="52" fill="#7c2d12" font-size="24" font-weight="700">같은 2.0 s simulation, 다른 publish period</text><line x1="90" y1="285" x2="900" y2="285" stroke="#9a3412" stroke-width="3"/><g fill="#ea580c"><rect x="140" y="105" width="250" height="180" rx="12"/><rect x="570" y="240" width="250" height="45" rx="12"/></g><g fill="#fff" font-size="22" font-weight="700" text-anchor="middle"><text x="265" y="150">Δt = 0.05 s</text><text x="265" y="185">약 40 samples</text><text x="695" y="272">Δt = 0.20 s · 약 10</text></g><g fill="#7c2d12" font-size="16" text-anchor="middle"><text x="265" y="322">fast world</text><text x="695" y="322">slow world</text></g><text x="480" y="82" fill="#9a3412" text-anchor="middle" font-size="17">host FPS가 아니라 /world/.../stats의 simTime과 실제 메시지 수를 비교합니다.</text></g></svg>
