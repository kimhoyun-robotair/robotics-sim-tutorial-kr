<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Transport 콜백과 update 경계</title><desc id="desc">Transport 스레드가 명령을 mailbox에 저장하고 simulation update가 상태를 적용하는 흐름</desc><rect width="960" height="360" rx="24" fill="#111827"/><g font-family="sans-serif"><text x="48" y="48" fill="#f9fafb" font-size="24" font-weight="700">Thread boundary: callback writes, update applies</text><rect x="55" y="90" width="270" height="210" rx="18" fill="#1f2937" stroke="#38bdf8" stroke-width="3"/><rect x="635" y="90" width="270" height="210" rx="18" fill="#1f2937" stroke="#34d399" stroke-width="3"/><rect x="386" y="130" width="188" height="130" rx="18" fill="#f8fafc"/><g text-anchor="middle"><text x="190" y="130" fill="#7dd3fc" font-size="18" font-weight="700">Transport thread</text><text x="190" y="175" fill="#e5e7eb">enable subscription</text><text x="190" y="210" fill="#e5e7eb">reset request</text><text x="190" y="245" fill="#e5e7eb">타입 검사</text><text x="480" y="178" fill="#0f172a" font-size="18" font-weight="700">mailbox</text><text x="480" y="210" fill="#475569">pending command</text><text x="770" y="130" fill="#6ee7b7" font-size="18" font-weight="700">Simulation update</text><text x="770" y="175" fill="#e5e7eb">ECS 읽기</text><text x="770" y="210" fill="#e5e7eb">상태 전이</text><text x="770" y="245" fill="#e5e7eb">topic publish</text></g><g stroke="#fbbf24" stroke-width="5"><path d="M325 195h55"/><path d="M580 195h49"/></g><g fill="#fbbf24"><path d="m380 195-12-8v16z"/><path d="m629 195-12-8v16z"/></g></g></svg>
