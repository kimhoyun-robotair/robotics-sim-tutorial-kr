<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">통신 콜백과 시뮬레이션 갱신</title><desc id="desc">통신 스레드가 명령을 임시 저장하고 시뮬레이션 갱신 코드가 상태에 적용하는 흐름</desc><rect width="960" height="360" rx="24" fill="#111827"/><g font-family="sans-serif"><text x="48" y="48" fill="#f9fafb" font-size="24" font-weight="700">명령 수신과 상태 변경을 나눠 처리한다</text><rect x="55" y="90" width="270" height="210" rx="18" fill="#1f2937" stroke="#38bdf8" stroke-width="3"/><rect x="635" y="90" width="270" height="210" rx="18" fill="#1f2937" stroke="#34d399" stroke-width="3"/><rect x="386" y="130" width="188" height="130" rx="18" fill="#f8fafc"/><g text-anchor="middle"><text x="190" y="130" fill="#7dd3fc" font-size="18" font-weight="700">통신 스레드</text><text x="190" y="175" fill="#e5e7eb">활성화 명령 수신</text><text x="190" y="210" fill="#e5e7eb">초기화 요청</text><text x="190" y="245" fill="#e5e7eb">타입 검사</text><text x="480" y="178" fill="#0f172a" font-size="18" font-weight="700">명령 보관함</text><text x="480" y="210" fill="#475569">대기 중인 명령</text><text x="770" y="130" fill="#6ee7b7" font-size="18" font-weight="700">시뮬레이션 갱신</text><text x="770" y="175" fill="#e5e7eb">ECS 읽기</text><text x="770" y="210" fill="#e5e7eb">상태 변경</text><text x="770" y="245" fill="#e5e7eb">토픽 발행</text></g><g stroke="#fbbf24" stroke-width="5"><path d="M325 195h55"/><path d="M580 195h49"/></g><g fill="#fbbf24"><path d="m380 195-12-8v16z"/><path d="m629 195-12-8v16z"/></g></g></svg>
