<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">모델 생성·제거에 따른 진단 상태</title><desc id="desc">모델 대기, 준비, 비활성화, 제거 상태와 다시 생성된 모델의 기준점 설정</desc><rect width="960" height="360" rx="24" fill="#f1f5f9"/><g font-family="sans-serif" text-anchor="middle"><text x="480" y="48" fill="#0f172a" font-size="24" font-weight="700">모델 상태에 따라 거리 기록하기</text><g fill="#fff" stroke="#0f766e" stroke-width="3"><rect x="55" y="125" width="170" height="70" rx="35"/><rect x="280" y="125" width="140" height="70" rx="35"/><rect x="485" y="125" width="140" height="70" rx="35"/><rect x="690" y="125" width="210" height="70" rx="35"/></g><g fill="#134e4a" font-size="16" font-weight="700"><text x="140" y="166">WAITING_FOR_MODEL</text><text x="350" y="166">READY</text><text x="555" y="166">DISABLED</text><text x="795" y="166">MODEL_REMOVED</text></g><g stroke="#0f766e" stroke-width="4" fill="none"><path d="M225 160h49"/><path d="M420 146h59"/><path d="M485 178h-59"/><path d="M420 160h264"/><path d="M795 204q0 76-655 0"/></g><g fill="#0f766e"><path d="m274 160-11-7v14z"/><path d="m479 146-11-7v14z"/><path d="m426 178 11-7v14z"/><path d="m684 160-11-7v14z"/><path d="m140 204-7 11h14z"/></g><text x="480" y="302" fill="#334155" font-size="17">모델이 다시 생성되면 그 위치를 기준으로 거리 0부터 기록한다.</text></g></svg>
