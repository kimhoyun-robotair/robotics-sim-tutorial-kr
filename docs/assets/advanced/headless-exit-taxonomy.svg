<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Headless 검사 종료 코드 분류</title><desc id="desc">성공, 계약 오류, 모델 누락, 플러그인 누락, timeout, cleanup 실패의 서로 다른 종료 코드</desc><rect width="960" height="360" rx="24" fill="#f8fafc"/><g font-family="sans-serif"><text x="50" y="50" fill="#172554" font-size="24" font-weight="700">Exit code is part of the test result</text><g text-anchor="middle" font-weight="700"><g fill="#dbeafe" stroke="#2563eb" stroke-width="2"><rect x="40" y="115" width="130" height="110" rx="16"/><rect x="190" y="115" width="130" height="110" rx="16"/><rect x="340" y="115" width="130" height="110" rx="16"/><rect x="490" y="115" width="130" height="110" rx="16"/><rect x="640" y="115" width="130" height="110" rx="16"/><rect x="790" y="115" width="130" height="110" rx="16"/></g><g fill="#1e3a8a"><text x="105" y="158" font-size="28">0</text><text x="255" y="158" font-size="28">64</text><text x="405" y="158" font-size="28">20</text><text x="555" y="158" font-size="28">21</text><text x="705" y="158" font-size="28">124</text><text x="855" y="158" font-size="28">70</text><g font-size="14"><text x="105" y="192">nominal</text><text x="255" y="192">usage</text><text x="405" y="192">model</text><text x="555" y="192">plugin</text><text x="705" y="192">timeout</text><text x="855" y="192">cleanup</text></g></g></g><text x="480" y="285" text-anchor="middle" fill="#334155" font-size="17">scenario.json + cleanup.json + 실제 topic 표본이 함께 있어야 PASS입니다.</text></g></svg>
