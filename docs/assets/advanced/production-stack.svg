<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Production stack 검증 매트릭스</title><desc id="desc">설치 산출물에서 distance, transport, physics, headless 네 시나리오를 실행해 관측과 cleanup 증거를 결합하는 구조</desc><defs><radialGradient id="g"><stop stop-color="#312e81"/><stop offset="1" stop-color="#111827"/></radialGradient></defs><rect width="960" height="360" rx="24" fill="url(#g)"/><g font-family="sans-serif"><text x="48" y="48" fill="#fff" font-size="24" font-weight="700">Advanced checker matrix</text><circle cx="480" cy="185" r="76" fill="#f8fafc"/><g text-anchor="middle"><text x="480" y="177" fill="#1e1b4b" font-size="19" font-weight="700">fresh install</text><text x="480" y="205" fill="#475569">same source SHA</text></g><g fill="#a5b4fc" stroke="#e0e7ff" stroke-width="2"><rect x="70" y="92" width="210" height="72" rx="18"/><rect x="680" y="92" width="210" height="72" rx="18"/><rect x="70" y="230" width="210" height="72" rx="18"/><rect x="680" y="230" width="210" height="72" rx="18"/></g><g text-anchor="middle" fill="#1e1b4b" font-size="18" font-weight="700"><text x="175" y="136">distance / lifecycle</text><text x="785" y="136">Transport types</text><text x="175" y="274">physics / simTime</text><text x="785" y="274">headless / cleanup</text></g><g stroke="#c4b5fd" stroke-width="4"><path d="M280 128l128 38"/><path d="M680 128l-128 38"/><path d="M280 266l128-51"/><path d="M680 266l-128-51"/></g><text x="480" y="330" fill="#ddd6fe" text-anchor="middle" font-size="17">banner가 아니라 parsed observable과 zero-survivor receipt로 완료를 판정합니다.</text></g></svg>
