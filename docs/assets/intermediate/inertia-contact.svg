<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t"><title id="t">관성 텐서와 접촉력 구조</title><rect width="960" height="360" rx="24" fill="#171c2b"/><g font-family="sans-serif"><rect x="90" y="85" width="250" height="135" rx="18" fill="#293755" stroke="#7dd3fc" stroke-width="4"/><text x="215" y="145" fill="white" font-size="24" text-anchor="middle">질량 m, 관성 I</text><text x="215" y="180" fill="#bae6fd" font-size="19" text-anchor="middle">가속 저항</text><path d="M215 220v70" stroke="#fbbf24" stroke-width="7"/><text x="235" y="270" fill="#fbbf24" font-size="21">mg</text><path d="M215 310v-70" stroke="#34d399" stroke-width="7"/><text x="235" y="315" fill="#34d399" font-size="21">N</text><line x1="35" y1="310" x2="450" y2="310" stroke="#94a3b8" stroke-width="6"/><rect x="535" y="70" width="335" height="220" rx="18" fill="#222b3f"/><text x="702" y="120" text-anchor="middle" fill="#f8fafc" font-size="22">직육면체 관성 예</text><text x="702" y="170" text-anchor="middle" fill="#7dd3fc" font-size="23">Iₓₓ = m(b²+c²)/12</text><text x="702" y="215" text-anchor="middle" fill="#fbbf24" font-size="20">마찰 한계 |Fₜ| ≤ μN</text><text x="702" y="255" text-anchor="middle" fill="#cbd5e1" font-size="17">visual ≠ collision ≠ inertia</text></g></svg>
