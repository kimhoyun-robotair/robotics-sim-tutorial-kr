<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t"><title id="t">차동구동 운동학과 controller lifecycle</title><rect width="960" height="360" rx="24" fill="#151f2a"/><g font-family="sans-serif"><circle cx="190" cy="180" r="74" fill="#1e3a5f" stroke="#60a5fa" stroke-width="5"/><line x1="95" y1="115" x2="95" y2="245" stroke="#fbbf24" stroke-width="18"/><line x1="285" y1="115" x2="285" y2="245" stroke="#fbbf24" stroke-width="18"/><text x="190" y="175" text-anchor="middle" fill="white" font-size="19">r = 0.06 m</text><text x="190" y="205" text-anchor="middle" fill="#bfdbfe" font-size="18">L = 0.38 m</text><rect x="440" y="65" width="430" height="230" rx="18" fill="#263446"/><text x="655" y="115" text-anchor="middle" fill="white" font-size="22">v = r(ωᵣ + ωₗ)/2</text><text x="655" y="155" text-anchor="middle" fill="#7dd3fc" font-size="22">Ω = r(ωᵣ − ωₗ)/L</text><text x="655" y="215" text-anchor="middle" fill="#34d399" font-size="19">inactive → configure → active</text><text x="655" y="255" text-anchor="middle" fill="#fca5a5" font-size="17">interface claim은 동시에 하나</text></g></svg>
