<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">중급 과정 전체 데이터 흐름</title><desc id="d">모델, 실행, 관측, 제어, 자율주행이 연결되는 구조</desc><rect width="960" height="360" rx="24" fill="#10212b"/><g font-family="sans-serif" text-anchor="middle"><g fill="#163b4d" stroke="#56c7da" stroke-width="3"><rect x="35" y="120" width="150" height="90" rx="14"/><rect x="220" y="120" width="150" height="90" rx="14"/><rect x="405" y="120" width="150" height="90" rx="14"/><rect x="590" y="120" width="150" height="90" rx="14"/><rect x="775" y="120" width="150" height="90" rx="14"/></g><g fill="#f5fbff" font-size="19"><text x="110" y="158">Xacro · SDF</text><text x="110" y="184">모델·world</text><text x="295" y="158">Launch</text><text x="295" y="184">준비 순서</text><text x="480" y="158">Bridge · TF</text><text x="480" y="184">관측 계약</text><text x="665" y="158">Controller</text><text x="665" y="184">운동</text><text x="850" y="158">Nav2</text><text x="850" y="184">goal</text></g><g stroke="#ffbf69" stroke-width="5" fill="none"><path d="M185 165h35"/><path d="M370 165h35"/><path d="M555 165h35"/><path d="M740 165h35"/></g><text x="480" y="65" fill="#ffbf69" font-size="27" font-weight="700">설정 → 실행 → 관측 → 판단</text><text x="480" y="290" fill="#b8d7e5" font-size="18">각 장의 출력이 다음 장의 입력이 되며 runtime checker가 경계를 관측한다.</text></g></svg>
