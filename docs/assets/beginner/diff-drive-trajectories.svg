<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">DiffDrive 세 가지 궤적</title>
  <desc id="desc">같은 바퀴 속도의 직진, 오른쪽이 빠른 왼쪽 원호, 반대 바퀴 속도의 제자리 회전</desc>
  <rect width="960" height="420" rx="24" fill="#eef4f8"/>
  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(40 45)">
      <rect width="270" height="330" rx="20" fill="#ffffff" stroke="#b0bec5" stroke-width="3"/>
      <text x="135" y="45" font-size="28" font-weight="700" fill="#17324d">직진</text>
      <path d="M135 265V100" stroke="#e65100" stroke-width="10"/>
      <path d="M135 90l-20 34h40z" fill="#e65100"/>
      <rect x="90" y="250" width="90" height="55" rx="12" fill="#1565c0"/>
      <text x="135" y="320" font-size="20" fill="#263238">ωL = ωR</text>
    </g>
    <g transform="translate(345 45)">
      <rect width="270" height="330" rx="20" fill="#ffffff" stroke="#b0bec5" stroke-width="3"/>
      <text x="135" y="45" font-size="28" font-weight="700" fill="#17324d">왼쪽 원호</text>
      <path d="M85 285Q100 120 225 100" stroke="#00796b" stroke-width="10" fill="none"/>
      <path d="M228 99l-35-16 7 39z" fill="#00796b"/>
      <rect x="45" y="260" width="90" height="55" rx="12" fill="#1565c0" transform="rotate(-10 90 287)"/>
      <text x="135" y="320" font-size="20" fill="#263238">ωR &gt; ωL &gt; 0</text>
    </g>
    <g transform="translate(650 45)">
      <rect width="270" height="330" rx="20" fill="#ffffff" stroke="#b0bec5" stroke-width="3"/>
      <text x="135" y="45" font-size="28" font-weight="700" fill="#17324d">제자리 회전</text>
      <path d="M58 210A78 78 0 1 1 95 270" stroke="#8e24aa" stroke-width="10" fill="none"/>
      <path d="M90 270l8-40 30 28z" fill="#8e24aa"/>
      <rect x="90" y="170" width="90" height="80" rx="12" fill="#1565c0"/>
      <text x="135" y="320" font-size="20" fill="#263238">ωR = −ωL</text>
    </g>
  </g>
</svg>
