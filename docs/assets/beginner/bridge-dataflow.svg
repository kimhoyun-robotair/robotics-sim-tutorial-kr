<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Gazebo와 ROS 2 브리지 데이터 흐름</title>
  <desc id="desc">Gazebo Transport 센서 토픽이 parameter bridge와 image bridge를 통해 ROS 2 토픽으로 변환되는 방향</desc>
  <rect width="960" height="430" rx="24" fill="#eef4f8"/>
  <g font-family="sans-serif" fill="#17324d" text-anchor="middle">
    <text x="480" y="48" font-size="30" font-weight="700">메시지는 다리를 건널 때 형식이 바뀝니다</text>
    <g transform="translate(50 88)">
      <rect width="250" height="286" rx="20" fill="#fff" stroke="#e65100" stroke-width="3"/>
      <text x="125" y="42" font-size="23" font-weight="700">Gazebo Transport</text>
      <text x="125" y="92" font-size="18">/tutorial_bot/lidar</text>
      <text x="125" y="132" font-size="18">/tutorial_bot/imu</text>
      <text x="125" y="172" font-size="18">/tutorial_bot/camera/image</text>
      <text x="125" y="212" font-size="18">/model/.../odometry</text>
      <text x="125" y="252" font-size="18">/clock</text>
    </g>
    <g transform="translate(365 88)">
      <rect width="230" height="286" rx="20" fill="#fff" stroke="#0288d1" stroke-width="3"/>
      <text x="115" y="43" font-size="23" font-weight="700">변환기</text>
      <rect x="30" y="78" width="170" height="72" rx="14" fill="#d8eef7"/>
      <text x="115" y="108" font-size="17" font-weight="700">parameter_bridge</text>
      <text x="115" y="133" font-size="15">YAML 방향·형식</text>
      <rect x="30" y="180" width="170" height="72" rx="14" fill="#e0f2f1"/>
      <text x="115" y="210" font-size="17" font-weight="700">image_bridge</text>
      <text x="115" y="235" font-size="15">픽셀 데이터 전용</text>
    </g>
    <g transform="translate(660 88)">
      <rect width="250" height="286" rx="20" fill="#fff" stroke="#00796b" stroke-width="3"/>
      <text x="125" y="42" font-size="23" font-weight="700">ROS 2</text>
      <text x="125" y="92" font-size="18">/scan · LaserScan</text>
      <text x="125" y="132" font-size="18">/imu · Imu</text>
      <text x="125" y="172" font-size="18">/tutorial_bot/.../image</text>
      <text x="125" y="212" font-size="18">/odom · Odometry</text>
      <text x="125" y="252" font-size="18">/clock · Clock</text>
    </g>
    <path d="M305 210H355" stroke="#0288d1" stroke-width="6"/><path d="M355 210l-18-12v24z" fill="#0288d1"/>
    <path d="M600 210H650" stroke="#00796b" stroke-width="6"/><path d="M650 210l-18-12v24z" fill="#00796b"/>
    <path d="M650 342H600" stroke="#8e24aa" stroke-width="5"/><path d="M600 342l18-12v24z" fill="#8e24aa"/>
    <text x="625" y="326" font-size="15">/cmd_vel</text>
  </g>
</svg>
