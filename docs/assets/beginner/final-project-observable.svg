<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">초급 최종 프로젝트 성공 화면 구성</title>
  <desc id="desc">움직이는 tutorial bot과 ROS 2에서 보이는 오도메트리, 라이다, 카메라, IMU, 시뮬레이션 시계 관찰값</desc>
  <rect width="960" height="460" rx="24" fill="#eef4f8"/>
  <g font-family="sans-serif" fill="#17324d">
    <text x="480" y="48" text-anchor="middle" font-size="30" font-weight="700">명령 하나, 서로 맞물린 다섯 관찰값</text>
    <g transform="translate(55 92)">
      <rect width="370" height="310" rx="20" fill="#fff" stroke="#1565c0" stroke-width="3"/>
      <path d="M60 250H315" stroke="#b0bec5" stroke-width="5"/>
      <rect x="130" y="175" width="120" height="65" rx="14" fill="#1565c0"/>
      <circle cx="150" cy="250" r="28" fill="#263238"/><circle cx="230" cy="250" r="28" fill="#263238"/>
      <circle cx="190" cy="160" r="13" fill="#0288d1"/>
      <path d="M190 160L315 110M190 160L325 160M190 160L315 210" stroke="#0288d1" stroke-width="4"/>
      <path d="M95 130H245" stroke="#e65100" stroke-width="8"/><path d="M260 130l-28-18v36z" fill="#e65100"/>
      <text x="185" y="55" text-anchor="middle" font-size="22" font-weight="700">Gazebo: +x로 이동</text>
      <text x="185" y="292" text-anchor="middle" font-size="17">LiDAR rays + camera scene</text>
    </g>
    <g transform="translate(475 92)">
      <rect width="430" height="310" rx="20" fill="#17324d"/>
      <text x="28" y="46" fill="#80cbc4" font-family="monospace" font-size="18">$ ros2 topic list</text>
      <text x="28" y="82" fill="#fff" font-family="monospace" font-size="18">/odom    x &gt; 0.05 m</text>
      <text x="28" y="116" fill="#fff" font-family="monospace" font-size="18">/scan    360 ranges</text>
      <text x="28" y="150" fill="#fff" font-family="monospace" font-size="18">/imu     angular + linear</text>
      <text x="28" y="184" fill="#fff" font-family="monospace" font-size="18">/tutorial_bot/camera/image</text>
      <text x="28" y="218" fill="#fff" font-family="monospace" font-size="18">/clock   simulation time</text>
      <rect x="28" y="250" width="374" height="38" rx="8" fill="#00796b"/>
      <text x="215" y="276" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">값을 파싱했을 때만 PASS</text>
    </g>
  </g>
</svg>
