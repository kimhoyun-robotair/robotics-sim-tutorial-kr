<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Gazebo Fuel 자원 해석 흐름</title>
  <desc id="desc">HTTPS Fuel URI가 다운로드 캐시를 거쳐 월드 인스턴스가 되고 로컬 model URI는 resource path에서 검색되는 두 경로</desc>
  <rect width="960" height="360" rx="24" fill="#eef4f8"/>
  <g font-family="sans-serif" fill="#17324d" text-anchor="middle">
    <text x="480" y="46" font-size="30" font-weight="700">URI를 실제 모델로 찾는 두 경로</text>
    <g transform="translate(50 82)">
      <rect width="250" height="100" rx="18" fill="#fff" stroke="#0288d1" stroke-width="3"/>
      <text x="125" y="38" font-size="21" font-weight="700">Fuel HTTPS URI</text>
      <text x="125" y="70" font-size="16">owner / models / name</text>
    </g>
    <path d="M305 132H380" stroke="#e65100" stroke-width="6"/><path d="M380 132l-18-12v24z" fill="#e65100"/>
    <g transform="translate(390 82)">
      <rect width="220" height="100" rx="18" fill="#fff" stroke="#e65100" stroke-width="3"/>
      <text x="110" y="38" font-size="21" font-weight="700">Fuel cache</text>
      <text x="110" y="70" font-size="15">GZ_FUEL_CACHE_PATH</text>
    </g>
    <path d="M615 132H690" stroke="#00796b" stroke-width="6"/><path d="M690 132l-18-12v24z" fill="#00796b"/>
    <g transform="translate(700 82)">
      <rect width="210" height="100" rx="18" fill="#fff" stroke="#00796b" stroke-width="3"/>
      <text x="105" y="38" font-size="21" font-weight="700">world instance</text>
      <text x="105" y="70" font-size="17">fuel_coke</text>
    </g>
    <g transform="translate(130 225)">
      <rect width="250" height="84" rx="18" fill="#fff" stroke="#8e24aa" stroke-width="3"/>
      <text x="125" y="34" font-size="21" font-weight="700">model://Coke</text>
      <text x="125" y="62" font-size="15">로컬 URI</text>
    </g>
    <path d="M385 267H505" stroke="#8e24aa" stroke-width="6"/><path d="M505 267l-18-12v24z" fill="#8e24aa"/>
    <g transform="translate(515 225)">
      <rect width="315" height="84" rx="18" fill="#fff" stroke="#8e24aa" stroke-width="3"/>
      <text x="157" y="34" font-size="20" font-weight="700">GZ_SIM_RESOURCE_PATH</text>
      <text x="157" y="62" font-size="15">model 디렉터리의 부모 탐색</text>
    </g>
  </g>
</svg>
