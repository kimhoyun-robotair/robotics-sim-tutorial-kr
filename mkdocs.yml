site_name: ROS 2 Jazzy × Gazebo Harmonic 튜토리얼
site_description: Ubuntu 24.04, ROS 2 Jazzy, Gazebo Harmonic을 위한 실행 중심 한국어 튜토리얼
repo_url: https://github.com/kimhoyun-robotair/gazebo-sim-tutorial-kr
repo_name: kimhoyun-robotair/gazebo-sim-tutorial-kr
edit_uri: edit/Jazzy/docs/

theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: 어두운 테마로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: 밝은 테마로 전환

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js
  - https://cdn.jsdelivr.net/npm/mermaid@11.10.1/dist/mermaid.min.js
  - javascripts/mermaid.js

nav:
  - 홈: index.md
  - 학습 로드맵: 01_roadmap.md
  - 시작하기:
      - 호환성: 02_getting-started/00_compatibility.md
      - Gazebo Harmonic 소개: 02_getting-started/01_gazebo-harmonic.md
      - Jazzy 환경 설치: 02_getting-started/02_installation-jazzy.md
      - 문제 해결: 02_getting-started/03_troubleshooting.md
  - 초급:
      - 개요: 03_beginner/index.md
      - Gazebo Sim 개요: 03_beginner/01-gazebo-overview.md
      - GUI 기초: 03_beginner/02-gui-basics.md
      - SDF 기초: 03_beginner/03-sdf-basics.md
      - 첫 World: 03_beginner/04-first-world.md
      - 첫 Robot: 03_beginner/05-first-robot.md
      - 바퀴와 Joint: 03_beginner/06-joints.md
      - DiffDrive: 03_beginner/07-diff-drive.md
      - 센서: 03_beginner/08-sensors.md
      - Gazebo Fuel: 03_beginner/09-gazebo-fuel.md
      - ROS 2와 연결: 03_beginner/10-ros-gz-bridge.md
      - 프로젝트: 03_beginner/11_project-tutorial-bot.md
  - 중급:
      - 개요: 04_intermediate/index.md
      - 고급 SDF: 04_intermediate/01-advanced-sdf.md
      - URDF·Xacro·SDF: 04_intermediate/02-urdf-xacro-sdf.md
      - ROS 2 Launch: 04_intermediate/03-ros2-launch.md
      - Robot Spawn: 04_intermediate/04-spawn-model.md
      - ros_gz_bridge 심화: 04_intermediate/05-bridge-yaml.md
      - TF·Joint State·RViz: 04_intermediate/06-tf-rviz.md
      - gz_ros2_control: 04_intermediate/07-gz-ros2-control.md
      - 센서 심화: 04_intermediate/08-advanced-sensors.md
      - 다중 로봇: 04_intermediate/09-multi-robot.md
      - Nav2 연동: 04_intermediate/10-nav2.md
      - 프로젝트: 04_intermediate/11_project-autonomous-bot.md
  - 고급:
      - 개요: 05_advanced/index.md
      - ECS System Plugin: 05_advanced/01-ecs-system-plugin.md
      - Transport 인터페이스: 05_advanced/02-transport-interfaces.md
      - 물리와 주기 디버깅: 05_advanced/03-physics-debugging.md
      - Headless 통합 테스트: 05_advanced/04-headless-integration.md
      - CI 재현성: 05_advanced/05-ci-reproducibility.md
      - 프로젝트: 05_advanced/06_project-production-stack.md
  - 참고:
      - 명령어: 06_reference/01_commands.md
      - 용어: 06_reference/02_terminology.md
      - 렌더링 Fixture: 06_reference/03_visual-fixture.md
