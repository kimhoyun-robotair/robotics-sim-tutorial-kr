site_name: ROS 2 Humble × Gazebo Classic 11 튜토리얼
site_description: Ubuntu 22.04, ROS 2 Humble, Gazebo Classic 11을 위한 실행 중심 한국어 튜토리얼
repo_url: https://github.com/kimhoyun-robotair/gazebo-sim-tutorial-kr
repo_name: kimhoyun-robotair/gazebo-sim-tutorial-kr
edit_uri: edit/Humble/docs/

# main 브랜치의 Jazzy/Harmonic 문서는 Humble 브랜치 사이트에서 노출하지 않는다.
exclude_docs: |
  01_roadmap.md
  02_getting-started/**
  03_beginner/**
  04_intermediate/**
  05_advanced/**
  06_reference/**

theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: 어두운 테마로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: 밝은 테마로 전환

plugins:
  - search:
      lang: ko

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: course-mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js
  - https://cdn.jsdelivr.net/npm/mermaid@11.10.1/dist/mermaid.min.js
  - javascripts/mermaid.js

nav:
  - 홈: index.md
  - 1. 환경 구성: 01_setup.md
  - 2. URDF · Xacro · SDF: 02_urdf_xacro_sdf.md
  - 3. 2륜 + Caster 실습: 03_diffbot.md
  - 4. 4륜 Rover 실습: 04_rover.md
  - 5. 센서와 RViz: 05_sensors.md
  - 6. URDF 기반 TF · Odom: 06_tf_rviz.md
  - 7. 커스텀 Gazebo 플러그인: 07_custom_plugin.md
  - 8. 문제 해결 · 검증: 08_debugging.md
  - 9. 설계 원칙 · 다음 단계: 09_next_steps.md
  - 10. 빠른 참고표: 10_reference.md
